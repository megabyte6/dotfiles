name: update-flake-lock

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # needed to push the updated flake.lock

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.get-hosts.outputs.hosts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://cache.nixos-cuda.org
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=

      - name: Update flake.lock
        run: |
          cp flake.lock /tmp/flake.lock.old
          nix flake update

      - name: Summarize input changes
        run: |
          summary=$(jq -rn \
            --slurpfile old /tmp/flake.lock.old \
            --slurpfile new flake.lock '
              ($old[0].nodes) as $o
              | $new[0].nodes
              | to_entries
              | map(
                  .key as $name
                  | (.value.locked.rev // null) as $newrev
                  | ($o[$name].locked.rev // null) as $oldrev
                  | select($oldrev != null and $newrev != null and $oldrev != $newrev)
                  | "- \($name): \($oldrev[0:7]) → \($newrev[0:7])"
                )
              | .[]
            ')
          [ -z "$summary" ] && summary="No input revisions changed."
          printf '%s\n' "$summary" > summary.txt
          # Also surface it on the Actions run page
          {
            echo "### flake.lock updates"
            echo
            printf '%s\n' "$summary"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get host list
        id: get-hosts
        run: |
          hosts=$(nix eval --json '.#nixosConfigurations' --apply builtins.attrNames)
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: |
            flake.lock
            summary.txt

  build:
    needs: update
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host: ${{ fromJson(needs.update.outputs.hosts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download updated flake.lock
        uses: actions/download-artifact@v8
        with:
          name: flake-lock

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://cache.nixos-cuda.org
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=

      # If any host fails to build, the job fails here and the commit/push step
      # below never runs. This is to prevent a broken bump from being pushed to
      # the branch that NixOS machines track.
      - name: Build ${{ matrix.host }}
        run: nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" --no-link

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download updated flake.lock
        uses: actions/download-artifact@v8
        with:
          name: flake-lock

      - name: Commit and push the new lock
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock unchanged; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "flake.lock: update inputs" -m "$(cat summary.txt)" -- flake.lock
          git push
